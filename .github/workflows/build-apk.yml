name: Build ZamFit Pro APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          
      - name: FULL Fix Groovy 4 bugs (QName + XmlParser)
        run: |
          FILE=$(find /opt/hostedtoolcache/flutter -name flutter.groovy | head -n 1)
          echo "Before fix:"
          head -20 "$FILE"
          sed -i 's/import groovy.xml.QName/import groovy.namespace.QName/' "$FILE"
          sed -i 's/import groovy.util.XmlParser/import groovy.xml.XmlParser/' "$FILE"
          # Add XmlParser import if missing
          grep -q "XmlParser" "$FILE" || sed -i '1i import groovy.xml.XmlParser' "$FILE"
          echo "After fix:"
          head -20 "$FILE"
          
      - run: flutter pub get
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: zamfit-pro-RELEASE-2026
          path: build/app/outputs/flutter-apk/app-release.apk