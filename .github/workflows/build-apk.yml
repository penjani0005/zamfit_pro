name: Build ZamFit Pro APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Clean rebuild of android files to Flutter standard
        run: |
          sed -i 's/9\.1\.0/8.3.2/g' android/settings.gradle.kts
          sed -i 's/2\.4\.0/2.0.0/g' android/settings.gradle.kts
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle.kts")
          old = p.read_text()
          # Try to get real package name
          m = re.search(r'applicationId\s*=\s*"([^"]+)"', old)
          app_id = m.group(1) if m else "com.example.zamfit_pro"
          m2 = re.search(r'namespace\s*=\s*"([^"]+)"', old)
          ns = m2.group(1) if m2 else app_id

          new_content = f'''
          plugins {{
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }}

          android {{
              namespace = "{ns}"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {{
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }}

              kotlinOptions {{
                  jvmTarget = "17"
              }}

              defaultConfig {{
                  applicationId = "{app_id}"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }}

              buildTypes {{
                  release {{
                      signingConfig = signingConfigs.getByName("debug")
                  }}
              }}
          }}

          flutter {{
              source = "../.."
          }}

          dependencies {{}}
          '''
          p.write_text(new_content)
          print("NEW FILE:\n", new_content)
          PY

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zamfit-pro-RELEASE-2026
          path: build/app/outputs/flutter-apk/app-release.apk