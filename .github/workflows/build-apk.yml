name: Build ZamFit Pro APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix AGP 9.1 -> 8.2.2 (keep flutter include)
        run: |
          echo "BEFORE:"
          cat android/settings.gradle.kts
          sed -i 's/9\.1\.0/8.2.2/g' android/settings.gradle.kts
          sed -i 's/2\.4\.0/1.9.22/g' android/settings.gradle.kts
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          echo "AFTER:"
          cat android/settings.gradle.kts
          cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zamfit-pro-RELEASE-2026
          path: build/app/outputs/flutter-apk/app-release.apk