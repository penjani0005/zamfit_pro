name: Build ZamFit Pro APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix AGP + Kotlin syntax to work with Flutter 3.24.5
        run: |
          sed -i 's/9\.1\.0/8.3.2/g' android/settings.gradle.kts
          sed -i 's/2\.4\.0/2.0.0/g' android/settings.gradle.kts
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
          echo "Fixing app/build.gradle.kts kotlin syntax..."
          # Replace new kotlin { compilerOptions } with old kotlinOptions
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/build.gradle.kts")
          text = p.read_text()
          # Replace the new block
          text = text.replace(
              "kotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}",
              'kotlinOptions {\n    jvmTarget = "17"\n}'
          )
          # Fallback - handle different formatting
          text = text.replace("kotlin {", "kotlinOptions {").replace("compilerOptions {", "").replace("jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17", 'jvmTarget = "17"')
          # Clean double braces
          text = text.replace("kotlinOptions {\n    \n", "kotlinOptions {\n")
          p.write_text(text)
          print(text[2000:3000])
          PY
          
          cat android/settings.gradle.kts
          cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zamfit-pro-RELEASE-2026
          path: build/app/outputs/flutter-apk/app-release.apk