name: Build ZamFit Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --debug
        # First try debug build which is more forgiving
      - uses: actions/upload-artifact@v4
        with:
          name: zamfit-pro-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
