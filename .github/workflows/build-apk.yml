name: Build ZamFit Pro APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Downgrade AGP to 8.2.2 compatible with Flutter
        run: |
          cat android/settings.gradle.kts
          sed -i 's/com.android.application.*9.1.0/com.android.application" version "8.2.2" apply false/' android/settings.gradle.kts || true
          sed -i 's/8.2.2" apply false/8.2.2" apply false/' android/settings.gradle.kts
          # Force replace with known good versions
          echo 'pluginManagement {
              includeBuild("../flutter/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          include(":app")' > android/settings.gradle.kts
          cat android/settings.gradle.kts
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zamfit-pro-RELEASE-2026
          path: build/app/outputs/flutter-apk/app-release.apk