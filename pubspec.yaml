name: zamfit_pro
description: ZamFit Pro - Zambia Fitness App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  vibration: ^3.1.6
  device_info_plus: ^11.1.1
  shared_preferences: ^2.5.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
